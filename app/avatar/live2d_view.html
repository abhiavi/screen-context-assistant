<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { background: transparent; }
</style>
<script src="live2d_assets/js/pixi.min.js"></script>
<script src="live2d_assets/js/live2dcubismcore.min.js"></script>
<script src="live2d_assets/js/cubism4.min.js"></script>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const app = new PIXI.Application({
  view: document.getElementById("canvas"),
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundAlpha: 0,
  antialias: true,
});

let model = null;
let manifest = null;
let currentAvatarId = null;
let mouthTimer = null;
let mouthT = 0;
let currentState = "idle";
let flavorTimer = null;

function fitModel() {
  if (!model) return;
  app.renderer.resize(window.innerWidth, window.innerHeight);
  const scale = Math.min(window.innerWidth / model.internalModel.width, window.innerHeight / model.internalModel.height) * 0.92;
  model.scale.set(scale);
  model.x = (window.innerWidth - model.width) / 2;
  model.y = window.innerHeight - model.height;
}

function stopMouth() {
  if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
  if (model) {
    try { model.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", 0); } catch (e) {}
  }
}

function startMouth() {
  stopMouth();
  mouthT = 0;
  mouthTimer = setInterval(() => {
    if (!model) return;
    mouthT += 0.35;
    const v = Math.max(0, Math.sin(mouthT)) * 0.85;
    try { model.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", v); } catch (e) {}
  }, 60);
}

// Exposed to Qt via runJavaScript(). state: "idle" | "attentive" | "speaking"
window.setAvatarState = function(state) {
  currentState = state;
  if (!model || !manifest) return;
  const cfg = manifest[currentAvatarId];
  const expr = cfg.expressions || {};
  if (state === "attentive") {
    stopMouth();
    if (expr.attentive !== undefined) { try { model.expression(expr.attentive); } catch (e) {} }
    // NOTE: check !== undefined, not truthiness - some models (Mao) use
    // the empty string "" as an actual, valid motion group name, which a
    // plain `if (cfg.attentiveMotionGroup)` truthy check silently skips.
    if (cfg.attentiveMotionGroup !== undefined) { try { model.motion(cfg.attentiveMotionGroup); } catch (e) {} }
  } else if (state === "speaking") {
    if (expr.speaking !== undefined) { try { model.expression(expr.speaking); } catch (e) {} }
    startMouth();
  } else {
    stopMouth();
    if (expr.idle !== undefined) { try { model.expression(expr.idle); } catch (e) {} }
  }
};

// Livelier idle presence (plan feedback: "more movements instead of
// staying idle") - every 12-27s while genuinely idle (not mid-recall or
// mid-answer), play a random motion from the model's "extra" group as a
// brief flourish, then let the library's own idle-group autoplay resume.
// Skipped for models with no extra group configured (attentiveMotionGroup
// undefined).
function scheduleFlavorMotion() {
  if (flavorTimer) clearTimeout(flavorTimer);
  flavorTimer = setTimeout(() => {
    if (currentState === "idle" && model && manifest) {
      const cfg = manifest[currentAvatarId];
      if (cfg.attentiveMotionGroup !== undefined) {
        try { model.motion(cfg.attentiveMotionGroup); } catch (e) {}
      }
    }
    scheduleFlavorMotion();
  }, 12000 + Math.random() * 15000);
}
scheduleFlavorMotion();

// Exposed to Qt via runJavaScript(). Swaps the loaded character live,
// no page reload needed (avoids re-doing PixiJS/Cubism Core init each
// time - just tears down the old model and loads the new one).
window.setAvatar = async function(avatarId) {
  if (!manifest || !manifest[avatarId] || avatarId === currentAvatarId) return;
  const { Live2DModel } = PIXI.live2d;
  const cfg = manifest[avatarId];
  if (model) {
    app.stage.removeChild(model);
    model.destroy();
    model = null;
  }
  model = await Live2DModel.from("live2d_assets/" + cfg.model, { autoInteract: false });
  app.stage.addChild(model);
  currentAvatarId = avatarId;
  fitModel();
};

(async () => {
  manifest = await (await fetch("live2d_assets/avatars.json")).json();
  const params = new URLSearchParams(window.location.search);
  const initial = params.get("avatar") || "haru";
  await window.setAvatar(manifest[initial] ? initial : Object.keys(manifest)[0]);
  window.addEventListener("resize", fitModel);
})();
</script>
</body>
</html>
