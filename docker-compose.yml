services:
  postgres:
    image: postgres:16-alpine
    container_name: sca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Tailscale IP only - never 0.0.0.0 (plan §7)
      - "${BIND_HOST}:${POSTGRES_PORT}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./app/storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sca-qdrant
    restart: unless-stopped
    ports:
      - "${BIND_HOST}:${QDRANT_PORT}:6333"
      - "${BIND_HOST}:6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
